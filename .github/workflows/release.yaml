name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          cache: false
      - run: make build VERSION="$REF"
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${REF#refs/tags/}"
          notes='## Changes in this release:

          * Add your release notes here.'
          args=(--title "Release $REF" --notes "$notes")
          if [[ "$REF" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" ./bin/go-dsa.md "${args[@]}"
